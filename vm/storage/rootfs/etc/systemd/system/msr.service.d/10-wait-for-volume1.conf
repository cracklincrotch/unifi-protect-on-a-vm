# Added 2026-09-16 after an estate-wide recording outage.
#
# msr checks its recording path about four seconds after boot. On 2026-09-16
# it ran before /volume1 (the RAID holding every recording) was mounted,
# logged "43 camera(s) assigned to non-operational recording path
# '/srv/unifi-protect/video'" and never re-checked. ms went on capturing
# five-second segments into the tmpfs staging area and deleting them, so
# nothing was recorded for an hour while live view, detections and camera
# status all looked healthy. Restarting msr.service clears it.
#
# RequiresMountsFor pulls in volume1.mount and orders this unit after it.
# A Protect update may drop this file; re-apply it if recording stops after
# a reboot while the cameras still look connected.
[Unit]
RequiresMountsFor=/volume1
