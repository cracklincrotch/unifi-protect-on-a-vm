# Added 2026-09-17, extending the 09-16 fix to the playback and transcoding
# services. msr hit this first: it starts ~4 s after boot, checked its storage
# path before /volume1 was mounted, and never re-checked. msp hit the same race
# on the 09-16 boot and playback silently never started -- the timeline showed
# events, selecting one produced no stream -- until msp.service was restarted
# on 09-17. While in that state the services also log to /data/ms/logs instead
# of the array, which is a useful tell.
#
# RequiresMountsFor pulls in volume1.mount and orders this unit after it.
# A Protect update may drop this file; re-apply it if playback or recording
# misbehaves after a reboot while cameras look connected.
[Unit]
RequiresMountsFor=/volume1
